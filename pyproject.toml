[project]
name = "diabetic-retinopathy"
version = "0.1.0"
description = "Diabetic Retinopathy detection from retinal fundus images using EfficientNet-B4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "albumentations>=2.0.0",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "kaggle>=1.5",
    "onnx>=1.14",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
dev = ["ruff>=0.4", "jupyter>=1.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
