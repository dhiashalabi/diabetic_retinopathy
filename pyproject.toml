[project]
name = "diabetic-retinopathy"
version = "2.0.0"
description = "Diabetic Retinopathy detection from retinal fundus images using EfficientNetV2-S with two-stage transfer learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.26",
    "timm>=1.0.26",
    "albumentations>=2.0.8",
    "opencv-python-headless>=4.13",
    "scikit-learn>=1.8",
    "pandas>=3.0",
    "numpy>=2.4",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "tqdm>=4.67",
    "kaggle>=2.0",
    "scipy>=1.17",
    "onnx>=1.20",
    "onnxruntime>=1.24",
]

[project.optional-dependencies]
demo = ["gradio>=6.10"]
dev = ["ruff>=0.15", "jupyter>=1.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
